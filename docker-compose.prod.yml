services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
      args:
        VITE_REVERB_APP_KEY: ${VITE_REVERB_APP_KEY}
        VITE_REVERB_HOST: ${VITE_REVERB_HOST}
        VITE_REVERB_PORT: ${VITE_REVERB_PORT}
        VITE_REVERB_SCHEME: ${VITE_REVERB_SCHEME}
        VITE_APP_NAME: ${VITE_APP_NAME}
    image: laravel-web:latest
    ports:
      - "1209:80"
    depends_on:
      - app
    networks:
      - app-network
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
      args:
        VITE_REVERB_APP_KEY: ${VITE_REVERB_APP_KEY}
        VITE_REVERB_HOST: ${VITE_REVERB_HOST}
        VITE_REVERB_PORT: ${VITE_REVERB_PORT}
        VITE_REVERB_SCHEME: ${VITE_REVERB_SCHEME}
        VITE_APP_NAME: ${VITE_APP_NAME}
    image: laravel-app:latest
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - app-storage:/var/www/html/storage
    networks:
      - app-network
    restart: unless-stopped

  worker:
    image: laravel-app:latest
    command: ["php", "artisan", "queue:work", "--tries=3", "--timeout=90"]
    user: "www-data"
    env_file:
      - .env
    depends_on:
      - app
    networks:
      - app-network
    restart: unless-stopped

  reverb:
    image: laravel-app:latest
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    user: "www-data"
    ports:
      - "8080:8080"
    env_file:
      - .env
    depends_on:
      - app
    networks:
      - app-network
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=${DB_DATABASE:?DB_DATABASE must be set}
      - POSTGRES_USER=${DB_USERNAME:?DB_USERNAME must be set}
      - POSTGRES_PASSWORD=${DB_PASSWORD:?DB_PASSWORD must be set}
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:?DB_USERNAME must be set} -d ${DB_DATABASE:?DB_DATABASE must be set}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

networks:
  app-network:
    driver: bridge

volumes:
  db-data:
  app-storage:
